name: release-bridge

# Собирает bridge в самостоятельные бинарники (без Docker) и публикует в GitHub Release.
# Триггер — пуш тега вида v1.2.3:  git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # можно запустить вручную из вкладки Actions

permissions:
  contents: write # нужно для создания релиза и загрузки ассетов

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Собрать бинарники bridge (linux x64 + arm64)
        working-directory: bridge
        run: |
          bun install --frozen-lockfile || bun install
          bun build --compile --target=bun-linux-x64   src/index.ts --outfile ../oko-bridge-linux-x64
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile ../oko-bridge-linux-arm64
          # (по мере надобности: bun-darwin-arm64/x64, bun-windows-x64)

      - name: Контрольные суммы
        run: sha256sum oko-bridge-linux-x64 oko-bridge-linux-arm64 > SHA256SUMS.txt

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oko-bridge-linux-x64
            oko-bridge-linux-arm64
            SHA256SUMS.txt
          generate_release_notes: true
