services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PORT: "9998"
      BASE_URL: "${API_BASE_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      TRUSTED_ORIGINS: "${TRUSTED_ORIGINS}"
      INGEST_HOST: "${INGEST_HOST}"
      INGEST_SCHEME: "${INGEST_SCHEME}"   # rtsp (дефолт, если пусто) | rtsps (H1, TLS-ингест)
      BRIDGE_SECRET_KEY: "${BRIDGE_SECRET_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      STUB_AUTH: "${STUB_AUTH}"
      # Соцвход Google: пустые значения = провайдер выключен, кнопка не рисуется.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      NODE_ENV: "production"
      # Этап 3 — умная запись по движению: backend гейтит запись через Control API MediaMTX.
      MTX_API_URL: "http://mediamtx:9997"
      # Telegram-уведомления о движении (опционально; пусто → уведомления просто не шлются).
      # Создайте бота у @BotFather, задайте webhook на https://api.<домен>/api/telegram/webhook.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
    # Порт 9998 наружу НЕ публикуем — backend доступен MediaMTX'у и (позже) ЛК изнутри сети.
    # ЛК/API откроем через Traefik на следующем этапе.

  web:
    build:
      context: ./web
      args:
        # Vite инлайнит это в бандл на этапе сборки — задать в Dokploy → Environment.
        VITE_API_URL: "${VITE_API_URL}"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
    # Порт наружу не публикуем — Traefik роутит домен app. → web:3000.

  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8554:8554"       # RTSP ingest (открытый; оставить для плавного перехода)
      - "8322:8322"       # RTSPS ingest (TLS, фикс H1) — активен только когда включено шифрование
      - "8888:8888"       # HLS live
      - "8889:8889"       # WebRTC live
      - "8189:8189/udp"   # WebRTC ICE
      - "9996:9996"       # Playback API (архив)
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${SERVER_HOST}"
      # Внешний авторизатор — наш backend. Без него MediaMTX не пустит никого.
      MTX_AUTHHTTPADDRESS: "http://backend:9998/internal/mediamtx-auth"
      # ── RTSPS-ингест (H1) ВКЛючён: серт выпущен acme.sh в том ingest-certs (/certs/ingest.*) ──
      MTX_RTSPENCRYPTION: "optional"     # optional = 8554 (старые агенты) + 8322 (RTSPS) одновременно
      MTX_RTSPTRANSPORTS: "tcp"
      MTX_RTSPSADDRESS: ":8322"
      MTX_RTSPSERVERCERT: "/certs/ingest.crt"
      MTX_RTSPSERVERKEY: "/certs/ingest.key"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
      - ingest-certs:/certs:ro   # cert от acme.sh для RTSPS (пусто до первого выпуска — MediaMTX стартует на plaintext)

  # ── Выпуск и авто-продление TLS-серта для RTSPS-ингеста (H1) через Let's Encrypt DNS-01 (Cloudflare) ──
  # Кладёт cert в общий том ingest-certs; MediaMTX подхватывает обновление БЕЗ рестарта (hot-reload проверен).
  # Первый выпуск — вручную один раз (см. docs/INGEST_TLS.md), дальше `daemon` продлевает сам.
  acme:
    image: neilpang/acme.sh:latest
    restart: unless-stopped
    environment:
      CF_Token: "${CF_DNS_API_TOKEN}"   # Cloudflare API-токен (Zone:DNS:Edit + Zone:Read). Значение — в .env, НЕ в git.
    volumes:
      - ingest-certs:/certs
      - acme-data:/acme.sh
    command: daemon

volumes:
  recordings:
  pgdata:
  ingest-certs:
  acme-data:
