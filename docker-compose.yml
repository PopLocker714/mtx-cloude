services:
  mediamtx:
    # Тег запинен и проверен локально — не менять на latest, чтобы сервер не уехал версией.
    # ВАЖНО: env-переопределение списков (MTX_AUTHINTERNALUSERS_0_...) появилось ПОСЛЕ 1.15 —
    # на старых версиях авторизация из env молча не применится.
    image: bluenviron/mediamtx:1.19.2
    restart: unless-stopped
    ports:
      - "8554:8554"       # RTSP ingest — сюда пушит бридж/ffmpeg (TCP)
      - "8888:8888"       # HLS — live-просмотр плеером/в браузере
      - "8889:8889"       # WebRTC — live-просмотр в браузере с низкой задержкой
      - "8189:8189/udp"   # WebRTC ICE — медиапоток
      - "9996:9996"       # Playback API — просмотр/выгрузка архива по времени
      # 9997 (Control API) наружу НЕ публикуем — он для будущего ЛК, изнутри сети докера
    environment:
      # Публичный IP или домен сервера — нужен WebRTC, чтобы браузер нашёл медиапоток
      MTX_WEBRTCADDITIONALHOSTS: "${SERVER_HOST}"
      # Логины/пароли пользователей из mediamtx.yml (права заданы там же):
      # [0] publisher — только публикация потоков (бридж/камеры)
      # [1] viewer    — только просмотр live (read) и архива (playback)
      MTX_AUTHINTERNALUSERS_0_USER: "${PUBLISH_USER}"
      MTX_AUTHINTERNALUSERS_0_PASS: "${PUBLISH_PASS}"
      MTX_AUTHINTERNALUSERS_1_USER: "${VIEW_USER}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${VIEW_PASS}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings

volumes:
  recordings:
