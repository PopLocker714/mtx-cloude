services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PORT: "9998"
      BASE_URL: "${API_BASE_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      TRUSTED_ORIGINS: "${TRUSTED_ORIGINS}"
      INGEST_HOST: "${INGEST_HOST}"
      NODE_ENV: "production"
    # Порт 9998 наружу НЕ публикуем — backend доступен MediaMTX'у и (позже) ЛК изнутри сети.
    # ЛК/API откроем через Traefik на следующем этапе.

  web:
    build:
      context: ./web
      args:
        # Vite инлайнит это в бандл на этапе сборки — задать в Dokploy → Environment.
        VITE_API_URL: "${VITE_API_URL}"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
    # Порт наружу не публикуем — Traefik роутит домен app. → web:3000.

  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8554:8554"       # RTSP ingest
      - "8888:8888"       # HLS live
      - "8889:8889"       # WebRTC live
      - "8189:8189/udp"   # WebRTC ICE
      - "9996:9996"       # Playback API (архив)
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${SERVER_HOST}"
      # Внешний авторизатор — наш backend. Без него MediaMTX не пустит никого.
      MTX_AUTHHTTPADDRESS: "http://backend:9998/internal/mediamtx-auth"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings

volumes:
  recordings:
  pgdata:
